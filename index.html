<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="description" content="JG Hub, Greenie's personal home screen.">
  <title>JG Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20261120d">
  <link rel="stylesheet" href="taps.css?v=20261120d">
</head>
<body>
  <div class="wrap">
    <header class="app-header">
      <h1>JG Hub</h1>
      <p class="tagline">Greenie's personal home screen</p>
    </header>

    <section class="board" aria-labelledby="personal-heading">
      <h2 id="personal-heading">Personal</h2>
      <div class="grid" data-section="personal">
        <a class="tile" data-id="claudio-list" href="https://claudio-list.netlify.app" target="_blank" rel="noopener noreferrer">
          <span class="icon claudio" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M6 4.75h9.2a2 2 0 0 1 2 2V20l-6.6-2.8L4 20V6.75A2 2 0 0 1 6 4.75z"/></svg>
          </span>
          <span class="label">Claudio List</span>
        </a>
        <a class="tile" data-id="jg-taskpro" href="https://jg-taskpro.netlify.app" target="_blank" rel="noopener noreferrer">
          <span class="icon taskpro" aria-hidden="true">
            <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="m7.5 12 2.4 2.4 6.6-6.6"/></svg>
          </span>
          <span class="label">JG TaskPro</span>
        </a>
        <a class="tile" data-id="message-hub" href="https://claude.ai/artifact/8k2MEf9vsKdQmnv9D8ZYKa" target="_blank" rel="noopener noreferrer">
          <span class="icon messages" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M5 6.5h14a2 2 0 0 1 2 2V16a2 2 0 0 1-2 2H9l-4 3v-3H5a2 2 0 0 1-2-2V8.5a2 2 0 0 1 2-2z"/></svg>
          </span>
          <span class="label">Message Hub</span>
        </a>
        <a class="tile" data-id="invisalign-taps" href="#taps">
          <span class="icon taps" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M6.5 5.5c1.2-1 3-1 5.5-1s4.3 0 5.5 1c1.4 1.2 1.6 3.7 1.2 6.5-.4 3-1.3 6.5-2.6 6.5-1.2 0-1.4-3.5-4.1-3.5s-2.9 3.5-4.1 3.5c-1.3 0-2.2-3.5-2.6-6.5-.4-2.8-.2-5.3 1.2-6.5z"/><path d="m9.2 9.6 1.9 1.9 3.7-3.7"/></svg>
          </span>
          <span class="label">iTap board</span>
        </a>
        <a class="tile" data-id="main-rules" href="rules/">
          <span class="icon rules" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M7.2 3.6h6.8L18.8 8.2V19.6a1.2 1.2 0 0 1-1.2 1.2H7.2A1.2 1.2 0 0 1 6 19.6V4.8a1.2 1.2 0 0 1 1.2-1.2z"/><path d="M14 3.6v4.6h4.8"/><path d="M9 12.2h6"/><path d="M9 15.6h4.2"/></svg>
          </span>
          <span class="label">Main Rules</span>
        </a>
        <a class="tile" data-id="teslamate" href="https://tesla.drgreenie.com" target="_blank" rel="noopener noreferrer">
          <span class="icon tesla" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M4 14.5 6 9.5a2 2 0 0 1 1.9-1.3h8.2A2 2 0 0 1 18 9.5l2 5v3.3a1 1 0 0 1-1 1h-1.5a1 1 0 0 1-1-1v-1H7.5v1a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/><circle cx="7.5" cy="14" r="1"/><circle cx="16.5" cy="14" r="1"/></svg>
          </span>
          <span class="label">TeslaMate</span>
        </a>
        <a class="tile" data-id="tesla-dashboards" href="https://dash.drgreenie.com" target="_blank" rel="noopener noreferrer">
          <span class="icon tesla-dash" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M4 19h16"/><path d="M7 19V10"/><path d="M12 19V5"/><path d="M17 19V13"/></svg>
          </span>
          <span class="label">Tesla Dashboards</span>
        </a>
        <!-- Grok Bots tile hidden 2026-11-19 until a login exists (bot list offline)
        <a class="tile" data-id="grok-bot-list" href="https://orthoalien.github.io/grok-bot-list/" target="_blank" rel="noopener noreferrer">
          <span class="icon claudio" aria-hidden="true">
            <svg viewBox="0 0 24 24"><rect x="5" y="7" width="14" height="11" rx="3"/><path d="M12 4v3"/><circle cx="9.5" cy="12.5" r="1"/><circle cx="14.5" cy="12.5" r="1"/></svg>
          </span>
          <span class="label">Grok Bots</span>
        </a>
        -->
      </div>
    </section>

    <section class="board" aria-labelledby="home-heading">
      <h2 id="home-heading">Home</h2>
      <div class="grid" data-section="home">
        <a class="tile" data-id="hue" href="http://192.168.1.210:8787" target="_blank" rel="noopener noreferrer">
          <span class="icon hue" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M9 18h6m-5 3h4"/><path d="M8.2 14.2A5.5 5.5 0 1 1 15.8 14.2L14 16.5H10z"/></svg>
          </span>
          <span class="label">Hue</span>
          <span class="caption">home Wi-Fi only</span>
        </a>
        <a class="tile" data-id="ring" href="https://account.ring.com" target="_blank" rel="noopener noreferrer">
          <span class="icon ring" aria-hidden="true">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="11" r="3.2"/><path d="M4.8 10.2V8.5A7.2 7.2 0 0 1 12 1.5a7.2 7.2 0 0 1 7.2 7v1.7"/><path d="M5 10.5h14v8.2a2.3 2.3 0 0 1-2.3 2.3H7.3A2.3 2.3 0 0 1 5 18.7z"/></svg>
          </span>
          <span class="label">Ring</span>
          <span class="caption">opens Ring</span>
        </a>
      </div>
    </section>

    <footer>
      <a href="https://drgreenie.com" target="_blank" rel="noopener noreferrer">Back to drgreenie.com</a>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
  <script src="app.js"></script>
  <script src="https://accounts.google.com/gsi/client" async></script>
  <script src="taps-config.js?v=20261120d"></script>
  <script src="taps.js?v=20261120d"></script>
</body>
</html>
